<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment | Agarwal Crockery House</title>
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/cart.css">
</head>
<body>

<header class="site-header">
  <div class="header-row">
    <a class="logo-mark" href="index.html"><img src="assets/img/logo.png" alt="Agarwal Crockery House"></a>
    <div class="header-actions" style="margin-left:auto;">
      <a class="icon-link" href="orders.html"><i class="bi bi-receipt"></i><span class="label">Orders</span></a>
    </div>
  </div>
</header>

<main>
  <div class="auth-wrap">
    <div class="auth-card" style="max-width:460px;">
      <span class="eyebrow">Secure Payment</span>
      <h1>Pay for Order <span id="payOrderId"></span></h1>
      <p>Complete your payment securely to confirm this order.</p>

      <div class="summary-note" style="margin-bottom:24px;">
        <i class="bi bi-shield-lock"></i>
        Amount payable: <b id="payAmount" style="margin-left:4px;"></b>
      </div>

      <form id="paymentForm">
        <div class="field">
          <label for="cardNumber">Card Number</label>
          <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" required>
        </div>
        <div class="field-row">
          <div class="field">
            <label for="cardExpiry">Expiry</label>
            <input type="text" id="cardExpiry" placeholder="MM/YY" required>
          </div>
          <div class="field">
            <label for="cardCvv">CVV</label>
            <input type="text" id="cardCvv" placeholder="•••" required>
          </div>
        </div>
        <button type="submit" class="btn btn-dark btn-block">Pay Now <i class="bi bi-lock-fill"></i></button>
      </form>
      <p style="text-align:center; font-size:11.5px; color:var(--ink-soft); margin-top:16px;">
        <i class="bi bi-shield-check"></i> Payments are processed securely. This is a demo checkout for preview purposes.
      </p>
    </div>
  </div>
</main>

<footer class="site-footer" style="padding-top:36px;">
  <div class="footer-bottom" style="border-top:1px solid rgba(255,255,255,.08); padding-top:22px;">
    <span>© 2026 Agarwal Crockery House. All rights reserved.</span>
    <div class="policies">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="orders.html">My Orders</a>
    </div>
  </div>
</footer>

<script src="assets/js/products.js"></script>
<script src="assets/js/site.js"></script>
<script>
  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');
  var order = id ? window.AC.findOrder(id) : null;
  document.getElementById('payOrderId').textContent = order ? order.id : '';
  document.getElementById('payAmount').textContent = order && order.price ? '₹' + order.price.toLocaleString('en-IN') : '—';

  document.getElementById('paymentForm').addEventListener('submit', function (e) {
    e.preventDefault();
    if (order) window.AC.markPaid(order.id);
    window.location.href = 'order-details.html?id=' + (order ? order.id : '');
  });
</script>
</body>
</html>
