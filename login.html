<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Agarwal Crockery House</title>
<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>

<header class="site-header">
  <div class="header-row">
    <a class="logo-mark" href="index.html"><img src="assets/img/logo.png" alt="Agarwal Crockery House"></a>
    <div class="header-actions" style="margin-left:auto;">
      <a class="icon-link" href="shop.html"><i class="bi bi-bag"></i><span class="label">Shop</span></a>
      <a class="icon-link" href="cart.html"><i class="bi bi-cart3"></i><span class="label">Cart</span><span class="count" data-cart-count>0</span></a>
    </div>
  </div>
</header>

<main>
  <div class="auth-wrap">
    <div class="auth-card">
      <span class="eyebrow">Welcome Back</span>
      <h1>Login to Your Account</h1>
      <p>Access your orders, view confirmed pricing and pay securely once approved.</p>

      <form id="loginForm">
        <div class="field">
          <label for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="loginPassword">Password</label>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
        <div class="auth-foot">
          <label class="field-check"><input type="checkbox"> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>
        <button type="submit" class="btn btn-dark btn-block">Login <i class="bi bi-arrow-right"></i></button>
      </form>

      <div class="auth-divider">or</div>
      <p class="auth-switch">New to Agarwal Crockery House? <a href="register.html">Create an account</a></p>
    </div>
  </div>
</main>

<footer class="site-footer" style="padding-top:36px;">
  <div class="footer-bottom" style="border-top:1px solid rgba(255,255,255,.08); padding-top:22px;">
    <span>© 2026 Agarwal Crockery House. All rights reserved.</span>
    <div class="policies">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="#">Privacy Policy</a>
      <a href="#">Terms of Service</a>
    </div>
  </div>
</footer>

<script src="assets/js/products.js"></script>
<script src="assets/js/site.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    window.location.href = 'orders.html';
  });
</script>
</body>
</html>
