<!doctype html>
<html lang="en">

<link rel="icon" href="assets/img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">

<body>

<header class="site-header">
  <div class="header-row">
    <a class="logo-mark" href="index.html"><img src="assets/img/logo.png" alt="Agarwal Crockery House"></a>
    <form class="search-form" action="shop.html">
      <i class="bi bi-search"></i>
      <input type="search" name="q" placeholder="Search dinner sets, glassware, serveware...">
      <button type="submit" aria-label="Search"><i class="bi bi-arrow-right"></i></button>
    </form>
    <div class="header-actions">
      <a class="icon-link" href="account.html"><i class="bi bi-person"></i><span class="label">Account</span></a>
      <a class="icon-link" href="wishlist.html"><i class="bi bi-heart"></i><span class="label">Wishlist</span></a>
      <a class="icon-link" href="cart.html"><i class="bi bi-bag"></i><span class="label">Cart</span><span class="count" data-cart-count>0</span></a>
    </div>
  </div>
</header>

<div class="page-hero">
  <div class="container">
    <div>
      <div class="breadcrumb"><a href="index.html">Home</a> / <a href="account.html">My Account</a> / <a href="orders.html">My Orders</a> / Order Details</div>
      <h1>Order <span id="odId"></span></h1>
      <p>Placed on <span id="odDate"></span></p>
    </div>
  </div>
</div>

<main>
  <div class="account-layout">
    <aside class="account-sidebar">
      <div class="account-user">
        <div class="account-avatar">R</div>
        <div>
          <b>Riya Sharma</b>
          <span>riya.sharma@email.com</span>
        </div>
      </div>
      <nav class="account-nav">
        <a href="account.html"><i class="bi bi-grid-1x2"></i> Dashboard</a>
        <a href="orders.html" class="active"><i class="bi bi-receipt"></i> My Orders</a>
        <a href="wishlist.html"><i class="bi bi-heart"></i> Wishlist</a>
        <a href="addresses.html"><i class="bi bi-geo-alt"></i> Saved Addresses</a>
        <a href="account-details.html"><i class="bi bi-person-gear"></i> Account Details</a>
        <a href="login.html" class="logout"><i class="bi bi-box-arrow-right"></i> Logout</a>
      </nav>
    </aside>

    <div class="account-main" id="orderDetailWrap">
      <div class="order-detail-head">
        <div>
          <span class="status-pill" id="odStatus"></span>
        </div>
      </div>
      <div class="cart-items" id="odItems"></div>
      <div class="order-price-panel" id="odPricePanel"></div>
    </div>
  </div>
</main>

<footer class="site-footer" style="padding-top:36px;">
  <div class="footer-bottom" style="border-top:1px solid rgba(255,255,255,.08); padding-top:22px;">
    <span>© 2026 Agarwal Crockery House. All rights reserved.</span>
    <div class="policies">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="orders.html">My Orders</a>
    </div>
  </div>

<script src="assets/js/products.js"></script>
<script src="assets/js/site.js"></script>
